name: Run and Publish ECMWF Meteograms

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SET UP PYTHON
      # ============================================

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ============================================
      # 3. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 4. RUN ECMWF METEOGRAM SCRIPTS
      # ============================================

      - name: Run ECMWF meteogram scripts
        run: |

          python athens_ecmwf.py
          python kiato_ecmwf.py
          python lamia_ecmwf.py
          python patra_ecmwf.py
          python salonica_ecmwf.py
          python ikaria_ecmwf.py


      # ============================================
      # 5. CHECK GENERATED FILES
      # ============================================

      - name: Check generated ECMWF PNG files
        run: |

          echo "========================================"
          echo "GENERATED ECMWF METEOGRAM FILES"
          echo "========================================"

          ls -lh *_ecmwf.png

          echo ""
          echo "Files:"
          find . -maxdepth 1 -name "*_ecmwf.png"


      # ============================================
      # 6. CONFIGURE GIT
      # ============================================

      - name: Configure Git
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================
      # 7. ADD ECMWF PNG FILES
      # ============================================

      - name: Add ECMWF meteograms
        run: |

          git add "*_ecmwf.png"

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # ============================================
      # 8. COMMIT
      # ============================================

      - name: Commit ECMWF meteograms
        run: |

          if git diff --cached --quiet; then

              echo "ℹ️ No ECMWF changes to commit."

          else

              git commit -m "Update ECMWF meteograms"

          fi


      # ============================================
      # 9. PUSH TO GITHUB
      # ============================================

      - name: Push ECMWF meteograms to GitHub
        run: |

          git push origin HEAD:${{ github.ref_name }}


      # ============================================
      # 10. SUMMARY
      # ============================================

      - name: Publish summary
        run: |

          echo "========================================"
          echo "✅ ECMWF METEOGRAM PUBLICATION COMPLETE"
          echo "========================================"

          echo ""
          echo "GitHub repository:"
          echo "https://github.com/meteogus/gfs-meteograms"

          echo ""
          echo "GitHub Pages:"
          echo "https://meteogus.github.io/gfs-meteograms/"
