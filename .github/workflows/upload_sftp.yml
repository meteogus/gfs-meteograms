name: Run and Publish Meteograms

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  build-and-publish:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SET UP PYTHON
      # ============================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================
      # 3. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 4. DETERMINE GFS RUN HOUR
      # ============================================

      - name: Determine GFS run hour
        run: |

          hour=$(date -u +"%H")

          if ((hour >= 0 && hour < 6)); then
              run_hour="00"

          elif ((hour >= 6 && hour < 12)); then
              run_hour="06"

          elif ((hour >= 12 && hour < 18)); then
              run_hour="12"

          else
              run_hour="18"
          fi

          echo "🕒 Current UTC hour: $hour"
          echo "📦 Using GFS run hour: $run_hour"

          echo "run_hour=$run_hour" >> "$GITHUB_ENV"


      # ============================================
      # 5. RUN METEOGRAM SCRIPTS
      # ============================================

      - name: Run meteogram scripts
        run: |

          python athens.py
          python kiato.py
          python lamia.py
          python patra.py
          python salonica.py
          python agrinio.py
          python chania.py
          python florina.py
          python heraklion.py
          python ikaria.py
          python ioannina.py
          python kefalonia.py
          python larisa.py
          python trikala.py
          python london.py

        env:
          RUN_HOUR: ${{ env.run_hour }}


      # ============================================
      # 6. CHECK GENERATED FILES
      # ============================================

      - name: Check generated PNG files
        run: |

          echo "========================================"
          echo "GENERATED METEOGRAM FILES"
          echo "========================================"

          ls -lh *.png

          echo ""
          echo "Total PNG files:"
          find . -maxdepth 1 -name "*.png" | wc -l


      # ============================================
      # 7. PREPARE GITHUB PAGES
      # ============================================

      - name: Prepare Pages directory
        run: |

          mkdir -p public

          cp *.png public/


      # ============================================
      # 8. CREATE INDEX.HTML
      # ============================================

      - name: Create Pages index
        run: |

          cat > public/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">

          <head>

            <meta charset="UTF-8">

            <meta name="viewport"
                  content="width=device-width, initial-scale=1.0">

            <meta http-equiv="refresh"
                  content="300">

            <title>GFS Meteograms</title>

            <style>

              body {
                margin: 0;
                padding: 20px;
                background: #eeeeee;
                font-family: Arial, sans-serif;
              }

              h1 {
                text-align: center;
                margin-bottom: 5px;
              }

              .run {
                text-align: center;
                margin-bottom: 25px;
                color: #555;
              }

              .grid {
                display: grid;
                grid-template-columns:
                  repeat(auto-fit, minmax(450px, 1fr));

                gap: 20px;

                max-width: 1800px;

                margin: auto;
              }

              .card {
                background: white;

                padding: 10px;

                border-radius: 8px;

                box-shadow:
                  0 2px 8px rgba(0,0,0,0.15);
              }

              .card h2 {
                text-align: center;

                margin:
                  5px 0 10px;

                font-size: 18px;
              }

              .card img {
                width: 100%;
                height: auto;
                display: block;
              }

            </style>

          </head>


          <body>

            <h1>GFS Meteograms</h1>

            <div class="run">
              Latest GFS run:
              <strong>${{ env.run_hour }}Z</strong>
            </div>


            <div class="grid">


              <div class="card">
                <h2>Athens</h2>
                <img src="athens${{ env.run_hour }}.png">
              </div>


              <div class="card">
                <h2>Kiato</h2>
                <img src="kiato${{ env.run_hour }}.png">
              </div>


              <div class="card">
                <h2>Lamia</h2>
                <img src="lamia${{ env.run_hour }}.png">
              </div>


              <div class="card">
                <h2>Patra</h2>
                <img src="patra${{ env.run_hour }}.png">
              </div>


              <div class="card">
                <h2>Salonica</h2>
                <img src="salonica${{ env.run_hour }}.png">
              </div>


              <div class="card">
                <h2>Agrinio</h2>
                <img src="agrinio.png">
              </div>


              <div class="card">
                <h2>Chania</h2>
                <img src="chania.png">
              </div>


              <div class="card">
                <h2>Florina</h2>
                <img src="florina.png">
              </div>


              <div class="card">
                <h2>Heraklion</h2>
                <img src="heraklion.png">
              </div>


              <div class="card">
                <h2>Ikaria</h2>
                <img src="ikaria.png">
              </div>


              <div class="card">
                <h2>Ioannina</h2>
                <img src="ioannina.png">
              </div>


              <div class="card">
                <h2>Kefalonia</h2>
                <img src="kefalonia.png">
              </div>


              <div class="card">
                <h2>Larisa</h2>
                <img src="larisa.png">
              </div>


              <div class="card">
                <h2>Trikala</h2>
                <img src="trikala.png">
              </div>


              <div class="card">
                <h2>London</h2>
                <img src="london.png">
              </div>


            </div>

          </body>

          </html>
          EOF


      # ============================================
      # 9. UPLOAD PAGES ARTIFACT
      # ============================================

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public


      # ============================================
      # 10. DEPLOY TO GITHUB PAGES
      # ============================================

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4


      # ============================================
      # 11. FINISHED
      # ============================================

      - name: Publish summary
        run: |

          echo "========================================"
          echo "✅ METEOGRAM PUBLICATION COMPLETE"
          echo "========================================"

          echo ""
          echo "GFS run: ${{ env.run_hour }}Z"

          echo ""
          echo "GitHub Pages:"
          echo "https://meteogus.github.io/gfs-meteograms/"

          echo ""
          echo "Athens:"
          echo "https://meteogus.github.io/gfs-meteograms/athens${{ env.run_hour }}.png"
