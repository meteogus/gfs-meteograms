name: Run and Upload Meteograms via SFTP

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install paramiko

      - name: Determine GFS run hour
        id: gfs_run
        run: |
          hour=$(date -u +"%H")

          if ((hour >= 0 && hour < 6)); then
              run_hour="00"
          elif ((hour >= 6 && hour < 12)); then
              run_hour="06"
          elif ((hour >= 12 && hour < 18)); then
              run_hour="12"
          else
              run_hour="18"
          fi

          echo "🕒 Current UTC hour: $hour"
          echo "📦 Using GFS run hour: $run_hour"

          echo "run_hour=$run_hour" >> "$GITHUB_ENV"

      - name: Run meteogram scripts
        run: |
          python athens.py
          python kiato.py
          python lamia.py
          python patra.py
          python salonica.py
          python agrinio.py
          python chania.py
          python florina.py
          python heraklion.py
          python ikaria.py
          python ioannina.py
          python kefalonia.py
          python larisa.py
          python trikala.py
          python london.py

           - name: Test SFTP write access
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_FOLDER: ${{ secrets.SFTP_FOLDER }}

        run: |
          python - <<'PYEOF'
          import paramiko
          import os
          import sys
          import posixpath

          host = os.getenv("SFTP_HOST")
          port = int(os.getenv("SFTP_PORT", "22"))
          user = os.getenv("SFTP_USER")
          password = os.getenv("SFTP_PASS")
          folder = os.getenv("SFTP_FOLDER", "/").rstrip("/")

          print("========================================")
          print("SFTP WRITE DIAGNOSTIC TEST")
          print("========================================")

          print(f"Host: {host}")
          print(f"Port: {port}")
          print(f"User: {user}")
          print(f"Folder: {folder}")

          try:

              transport = paramiko.Transport((host, port))

              transport.connect(
                  username=user,
                  password=password
              )

              sftp = paramiko.SFTPClient.from_transport(
                  transport
              )

              print("✅ SFTP connection established")

          except Exception as e:

              print(f"❌ Connection failed: {repr(e)}")
              sys.exit(1)

          # --------------------------------------------
          # TEST 1: stat folder
          # --------------------------------------------

          print("")
          print("TEST 1: Checking remote folder")

          try:

              attr = sftp.stat(folder)

              print(
                  f"✅ Folder exists: {folder}"
              )

              print(
                  f"   Mode: {oct(attr.st_mode)}"
              )

          except Exception as e:

              print(
                  f"❌ Cannot stat folder: "
                  f"{repr(e)}"
              )

          # --------------------------------------------
          # TEST 2: list folder
          # --------------------------------------------

          print("")
          print("TEST 2: Listing remote folder")

          try:

              files = sftp.listdir(folder)

              print(
                  f"✅ Folder readable"
              )

              print(
                  f"   Files found: {len(files)}"
              )

              for f in files[:10]:
                  print(f"   - {f}")

          except Exception as e:

              print(
                  f"❌ Cannot list folder: "
                  f"{repr(e)}"
              )

          # --------------------------------------------
          # TEST 3: create tiny file
          # --------------------------------------------

          test_name = ".sftp_test.txt"

          test_path = posixpath.join(
              folder,
              test_name
          )

          print("")
          print("TEST 3: Creating test file")

          print(
              f"Remote path: {test_path}"
          )

          try:

              with sftp.open(
                  test_path,
                  "wb"
              ) as f:

                  f.write(
                      b"SFTP WRITE TEST"
                  )

              print(
                  "✅ Test file created"
              )

          except Exception as e:

              print(
                  f"❌ Cannot create test file: "
                  f"{repr(e)}"
              )

          # --------------------------------------------
          # TEST 4: stat test file
          # --------------------------------------------

          print("")
          print("TEST 4: Checking test file")

          try:

              attr = sftp.stat(test_path)

              print(
                  f"✅ Test file exists"
              )

              print(
                  f"   Size: {attr.st_size} bytes"
              )

          except Exception as e:

              print(
                  f"❌ Cannot stat test file: "
                  f"{repr(e)}"
              )

          # --------------------------------------------
          # TEST 5: rename
          # --------------------------------------------

          renamed_path = posixpath.join(
              folder,
              ".sftp_test_renamed.txt"
          )

          print("")
          print("TEST 5: Rename test")

          try:

              sftp.rename(
                  test_path,
                  renamed_path
              )

              print(
                  "✅ Rename successful"
              )

          except Exception as e:

              print(
                  f"❌ Rename failed: "
                  f"{repr(e)}"
              )

          # --------------------------------------------
          # TEST 6: delete
          # --------------------------------------------

          print("")
          print("TEST 6: Delete test")

          try:

              sftp.remove(
                  renamed_path
              )

              print(
                  "✅ Delete successful"
              )

          except Exception as e:

              print(
                  f"❌ Delete failed: "
                  f"{repr(e)}"
              )

          # --------------------------------------------
          # CLOSE
          # --------------------------------------------

          sftp.close()
          transport.close()

          print("")
          print("========================================")
          print("DIAGNOSTIC TEST FINISHED")
          print("========================================")
          PYEOF
