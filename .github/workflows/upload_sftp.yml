name: Run and Upload Meteograms via SFTP

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install paramiko

      - name: Determine GFS run hour
        id: gfs_run
        run: |
          hour=$(date -u +"%H")

          if ((hour >= 0 && hour < 6)); then
              run_hour="00"
          elif ((hour >= 6 && hour < 12)); then
              run_hour="06"
          elif ((hour >= 12 && hour < 18)); then
              run_hour="12"
          else
              run_hour="18"
          fi

          echo "🕒 Current UTC hour: $hour"
          echo "📦 Using GFS run hour: $run_hour"

          echo "run_hour=$run_hour" >> "$GITHUB_ENV"

      - name: Run meteogram scripts
        run: |
          python athens.py
          python kiato.py
          python lamia.py
          python patra.py
          python salonica.py
          python agrinio.py
          python chania.py
          python florina.py
          python heraklion.py
          python ikaria.py
          python ioannina.py
          python kefalonia.py
          python larisa.py
          python trikala.py
          python london.py

      - name: Upload images via SFTP with paramiko
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_FOLDER: ${{ secrets.SFTP_FOLDER }}
          RUN_HOUR: ${{ env.run_hour }}

        run: |
          python - <<'PYEOF'
          import paramiko
          import os
          import sys
          import posixpath

          run_hour = os.getenv("RUN_HOUR", "00")

          print(f"🕒 Using run_hour: {run_hour}")

          files = [
              f"athens{run_hour}.png",
              f"kiato{run_hour}.png",
              f"lamia{run_hour}.png",
              f"patra{run_hour}.png",
              f"salonica{run_hour}.png",
              "agrinio.png",
              "chania.png",
              "florina.png",
              "heraklion.png",
              "ikaria.png",
              "ioannina.png",
              "kefalonia.png",
              "larisa.png",
              "trikala.png",
              "london.png",
          ]

          host = os.getenv("SFTP_HOST")
          port = int(os.getenv("SFTP_PORT", "22"))
          user = os.getenv("SFTP_USER")
          password = os.getenv("SFTP_PASS")
          folder = os.getenv("SFTP_FOLDER", "/").rstrip("/")

          if not all([host, user, password]):
              print("❌ Missing SFTP credentials")
              sys.exit(1)

          print(f"📡 Connecting to {host}:{port} as {user} ...")

          try:
              transport = paramiko.Transport((host, port))
              transport.connect(
                  username=user,
                  password=password
              )

              sftp = paramiko.SFTPClient.from_transport(transport)

              print("✅ SFTP connection established")

          except Exception as e:
              print(f"❌ Failed to connect or authenticate: {e}")
              sys.exit(1)

          failed = []

          for filename in files:

              local_path = filename

              remote_path = posixpath.join(
                  folder,
                  filename
              )

              temp_remote_path = remote_path + ".tmp"

              try:

                  # -----------------------------------------
                  # Check local file
                  # -----------------------------------------

                  if not os.path.isfile(local_path):
                      print(
                          f"❌ Local file not found: "
                          f"{local_path}"
                      )

                      failed.append(filename)
                      continue

                  local_size = os.path.getsize(
                      local_path
                  )

                  if local_size == 0:
                      print(
                          f"❌ Local file is empty: "
                          f"{local_path}"
                      )

                      failed.append(filename)
                      continue

                  print(
                      f"⬆️ Uploading {local_path} "
                      f"({local_size:,} bytes) "
                      f"to {remote_path} ..."
                  )

                  # -----------------------------------------
                  # Remove previous temporary file
                  # -----------------------------------------

                  try:
                      sftp.remove(
                          temp_remote_path
                      )
                  except IOError:
                      pass

                  # -----------------------------------------
                  # Upload using explicit write()
                  # -----------------------------------------

                  with open(
                      local_path,
                      "rb"
                  ) as local_file:

                      with sftp.open(
                          temp_remote_path,
                          "wb"
                      ) as remote_file:

                          while True:

                              chunk = local_file.read(
                                  1024 * 1024
                              )

                              if not chunk:
                                  break

                              remote_file.write(chunk)

                  # -----------------------------------------
                  # Verify remote file size
                  # -----------------------------------------

                  remote_attr = sftp.stat(
                      temp_remote_path
                  )

                  remote_size = remote_attr.st_size

                  print(
                      f"📦 Remote temporary file: "
                      f"{remote_size:,} bytes"
                  )

                  if remote_size != local_size:

                      print(
                          f"❌ Size mismatch for "
                          f"{filename}: "
                          f"local={local_size:,}, "
                          f"remote={remote_size:,}"
                      )

                      try:
                          sftp.remove(
                              temp_remote_path
                          )
                      except IOError:
                          pass

                      failed.append(filename)
                      continue

                  # -----------------------------------------
                  # Remove old final file
                  # -----------------------------------------

                  try:
                      sftp.remove(
                          remote_path
                      )
                  except IOError:
                      pass

                  # -----------------------------------------
                  # Rename temporary → final
                  # -----------------------------------------

                  sftp.rename(
                      temp_remote_path,
                      remote_path
                  )

                  print(
                      f"✅ Uploaded successfully: "
                      f"{filename} "
                      f"({remote_size:,} bytes)"
                  )

              except Exception as e:

                  print(
                      f"❌ Failed to upload "
                      f"{filename}: {e}"
                  )

                  failed.append(filename)

                  try:
                      sftp.remove(
                          temp_remote_path
                      )
                  except Exception:
                      pass

          # -----------------------------------------
          # Close SFTP
          # -----------------------------------------

          sftp.close()
          transport.close()

          # -----------------------------------------
          # Final result
          # -----------------------------------------

          if failed:

              print("")
              print(
                  "❌ Upload completed with errors:"
              )

              for filename in failed:
                  print(f"   - {filename}")

              sys.exit(1)

          else:

              print("")
              print(
                  "✅ All files uploaded successfully."
              )
          PYEOF
