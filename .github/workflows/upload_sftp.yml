name: Run and Publish Meteograms

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SET UP PYTHON
      # ============================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================
      # 3. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 4. DETERMINE GFS RUN HOUR
      # ============================================

      - name: Determine GFS run hour
        id: gfs_run
        run: |

          hour=$(date -u +"%H")

          if ((hour >= 0 && hour < 6)); then
              run_hour="00"

          elif ((hour >= 6 && hour < 12)); then
              run_hour="06"

          elif ((hour >= 12 && hour < 18)); then
              run_hour="12"

          else
              run_hour="18"
          fi

          echo "🕒 Current UTC hour: $hour"
          echo "📦 Using GFS run hour: $run_hour"

          echo "run_hour=$run_hour" >> "$GITHUB_ENV"


      # ============================================
      # 5. RUN METEOGRAM SCRIPTS
      # ============================================

      - name: Run meteogram scripts
        run: |

          python athens.py
          python kiato.py
          python lamia.py
          python patra.py
          python salonica.py
          python agrinio.py
          python chania.py
          python florina.py
          python heraklion.py
          python ikaria.py
          python ioannina.py
          python kefalonia.py
          python larisa.py
          python trikala.py
          python london.py

        env:
          RUN_HOUR: ${{ env.run_hour }}


      # ============================================
      # 6. CREATE LATEST COPIES
      # ============================================

      - name: Create latest copies
        run: |

          echo "========================================"
          echo "CREATING LATEST METEOGRAM COPIES"
          echo "========================================"

          cp "athens${{ env.run_hour }}.png" athens_latest.png
          cp "kiato${{ env.run_hour }}.png" kiato_latest.png
          cp "lamia${{ env.run_hour }}.png" lamia_latest.png
          cp "patra${{ env.run_hour }}.png" patra_latest.png
          cp "salonica${{ env.run_hour }}.png" salonica_latest.png

          cp "agrinio.png" agrinio_latest.png
          cp "chania.png" chania_latest.png
          cp "florina.png" florina_latest.png
          cp "heraklion.png" heraklion_latest.png
          cp "ikaria.png" ikaria_latest.png
          cp "ioannina.png" ioannina_latest.png
          cp "kefalonia.png" kefalonia_latest.png
          cp "larisa.png" larisa_latest.png
          cp "trikala.png" trikala_latest.png
          cp "london.png" london_latest.png

          echo ""
          echo "Latest files created:"
          ls -lh *_latest.png


      # ============================================
      # 7. CHECK GENERATED FILES
      # ============================================

      - name: Check generated PNG files
        run: |

          echo "========================================"
          echo "GENERATED METEOGRAM FILES"
          echo "========================================"

          ls -lh *.png

          echo ""
          echo "Total PNG files:"
          find . -maxdepth 1 -name "*.png" | wc -l


      # ============================================
      # 8. CONFIGURE GIT
      # ============================================

      - name: Configure Git
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================
      # 9. ADD PNG FILES
      # ============================================

      - name: Add generated PNG files
        run: |

          git add "*.png"

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # ============================================
      # 10. COMMIT CHANGES
      # ============================================

      - name: Commit meteograms
        run: |

          if git diff --cached --quiet; then

              echo "ℹ️ No changes to commit."

          else

              git commit -m "Update meteograms - GFS ${{ env.run_hour }}Z"

          fi


      # ============================================
      # 11. PUSH TO GITHUB
      # ============================================

      - name: Push meteograms to GitHub
        run: |

          git push origin HEAD:${{ github.ref_name }}


      # ============================================
      # 12. FINISHED
      # ============================================

      - name: Publish summary
        run: |

          echo "========================================"
          echo "✅ METEOGRAM PUBLICATION COMPLETE"
          echo "========================================"

          echo ""
          echo "GFS run: ${{ env.run_hour }}Z"

          echo ""
          echo "GitHub repository:"
          echo "https://github.com/meteogus/gfs-meteograms"

          echo ""
          echo "GitHub Pages:"
          echo "https://meteogus.github.io/gfs-meteograms/"

          echo ""
          echo "Latest Athens:"
          echo "https://meteogus.github.io/gfs-meteograms/athens_latest.png"

          echo ""
          echo "Latest Kiato:"
          echo "https://meteogus.github.io/gfs-meteograms/kiato_latest.png"

          echo ""
          echo "Latest Lamia:"
          echo "https://meteogus.github.io/gfs-meteograms/lamia_latest.png"

          echo ""
          echo "Latest Patra:"
          echo "https://meteogus.github.io/gfs-meteograms/patra_latest.png"

          echo ""
          echo "Latest Salonica:"
          echo "https://meteogus.github.io/gfs-meteograms/salonica_latest.png"
