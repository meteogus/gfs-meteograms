name: Run and Publish Meteograms

on:
  workflow_dispatch:
  repository_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT REPOSITORY
      # ============================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================
      # 2. SET UP PYTHON
      # ============================================

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ============================================
      # 3. INSTALL DEPENDENCIES
      # ============================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt


      # ============================================
      # 4. DETERMINE GFS RUN HOUR
      # ============================================

      - name: Determine GFS run hour
        run: |

          hour=$(date -u +"%H")

          if ((hour >= 0 && hour < 6)); then
              run_hour="00"

          elif ((hour >= 6 && hour < 12)); then
              run_hour="06"

          elif ((hour >= 12 && hour < 18)); then
              run_hour="12"

          else
              run_hour="18"
          fi

          echo "🕒 Current UTC hour: $hour"
          echo "📦 Using GFS run hour: $run_hour"

          echo "run_hour=$run_hour" >> "$GITHUB_ENV"


      # ============================================
      # 5. RUN METEOGRAM SCRIPTS
      # ============================================

      - name: Run meteogram scripts
        run: |

          python athens.py
          python kiato.py
          python lamia.py
          python patra.py
          python salonica.py
          python agrinio.py
          python chania.py
          python florina.py
          python heraklion.py
          python ikaria.py
          python ioannina.py
          python kefalonia.py
          python larisa.py
          python trikala.py
          python london.py

        env:
          RUN_HOUR: ${{ env.run_hour }}


      # ============================================
      # 6. PREPARE IMAGES DIRECTORY
      # ============================================

      - name: Prepare images directory
        run: |

          mkdir -p images

          echo "========================================"
          echo "MOVING GENERATED PNG FILES TO images/"
          echo "========================================"

          shopt -s nullglob

          for file in *.png; do
              mv "$file" images/
          done

          echo ""
          echo "Images directory:"
          ls -lh images/


      # ============================================
      # 7. CREATE / UPDATE LATEST FILES
      # ============================================

      - name: Create latest meteograms
        run: |

          echo "========================================"
          echo "CREATING LATEST METEOGRAM FILES"
          echo "========================================"

          cities=(
            athens
            kiato
            lamia
            patra
            salonica
          )

          for city in "${cities[@]}"; do

              source_file="images/${city}${run_hour}.png"
              latest_file="images/${city}_latest.png"

              if [ -f "$source_file" ]; then

                  cp "$source_file" "$latest_file"

                  echo "✅ ${city}_latest.png ← ${city}${run_hour}.png"

              else

                  echo "⚠️ Missing: $source_file"

              fi

          done

          echo ""
          echo "Latest files:"
          ls -lh images/*_latest.png 2>/dev/null || true


      # ============================================
      # 8. CHECK GENERATED FILES
      # ============================================

      - name: Check generated PNG files
        run: |

          echo "========================================"
          echo "ALL PNG FILES"
          echo "========================================"

          find images -maxdepth 1 -name "*.png" -type f -printf "%f\n" | sort

          echo ""
          echo "Total PNG files:"
          find images -maxdepth 1 -name "*.png" -type f | wc -l


      # ============================================
      # 9. CONFIGURE GIT
      # ============================================

      - name: Configure Git
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"


      # ============================================
      # 10. ADD METEOGRAM FILES
      # ============================================

      - name: Add meteogram files
        run: |

          git add images/*.png

          echo "========================================"
          echo "GIT STATUS"
          echo "========================================"

          git status --short


      # ============================================
      # 11. COMMIT
      # ============================================

      - name: Commit meteograms
        run: |

          if git diff --cached --quiet; then

              echo "ℹ️ No meteogram changes to commit."

          else

              git commit \
                -m "Update GFS meteograms - ${run_hour}Z"

          fi


      # ============================================
      # 12. PUSH
      # ============================================

      - name: Push meteograms to GitHub
        run: |

          git push origin HEAD:${{ github.ref_name }}


      # ============================================
      # 13. SUMMARY
      # ============================================

      - name: Publish summary
        run: |

          echo "========================================"
          echo "✅ GFS METEOGRAM PUBLICATION COMPLETE"
          echo "========================================"

          echo ""
          echo "GFS run: ${run_hour}Z"

          echo ""
          echo "Repository:"
          echo "https://github.com/meteogus/meteograms"

          echo ""
          echo "GitHub Pages:"
          echo "https://meteogus.github.io/meteograms/"

          echo ""
          echo "Images:"
          echo "https://meteogus.github.io/meteograms/images/"
