name: Run and Upload Meteograms via SFTP

on:
  workflow_dispatch:
  repository_dispatch:

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install paramiko

      - name: Determine GFS run hour
        id: gfs_run
        run: |
          hour=$(date -u +"%H")

          if ((hour >= 0 && hour < 6)); then
              run_hour="00"
          elif ((hour >= 6 && hour < 12)); then
              run_hour="06"
          elif ((hour >= 12 && hour < 18)); then
              run_hour="12"
          else
              run_hour="18"
          fi

          echo "🕒 Current UTC hour: $hour"
          echo "📦 Using GFS run hour: $run_hour"

          echo "run_hour=$run_hour" >> "$GITHUB_ENV"

      - name: Run meteogram scripts
        run: |
          python athens.py
          python kiato.py
          python lamia.py
          python patra.py
          python salonica.py
          python agrinio.py
          python chania.py
          python florina.py
          python heraklion.py
          python ikaria.py
          python ioannina.py
          python kefalonia.py
          python larisa.py
          python trikala.py
          python london.py

            - name: Upload images via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASS: ${{ secrets.SFTP_PASS }}
          SFTP_FOLDER: ${{ secrets.SFTP_FOLDER }}
          RUN_HOUR: ${{ env.run_hour }}

        run: |
          python - <<'PYEOF'
          import paramiko
          import os
          import sys
          import posixpath

          run_hour = os.getenv("RUN_HOUR", "00")

          files = [
              f"athens{run_hour}.png",
              f"kiato{run_hour}.png",
              f"lamia{run_hour}.png",
              f"patra{run_hour}.png",
              f"salonica{run_hour}.png",
              "agrinio.png",
              "chania.png",
              "florina.png",
              "heraklion.png",
              "ikaria.png",
              "ioannina.png",
              "kefalonia.png",
              "larisa.png",
              "trikala.png",
              "london.png",
          ]

          host = os.getenv("SFTP_HOST")
          port = int(os.getenv("SFTP_PORT", "22"))
          user = os.getenv("SFTP_USER")
          password = os.getenv("SFTP_PASS")
          folder = os.getenv("SFTP_FOLDER", "/").rstrip("/")

          print(f"🕒 Using run_hour: {run_hour}")
          print(f"📡 Connecting to {host}:{port} as {user} ...")

          try:
              transport = paramiko.Transport((host, port))

              transport.connect(
                  username=user,
                  password=password
              )

              sftp = paramiko.SFTPClient.from_transport(
                  transport
              )

              print("✅ SFTP connection established")

          except Exception as e:
              print(f"❌ SFTP connection failed: {repr(e)}")
              sys.exit(1)

          failed = []

          for filename in files:

              local_path = filename
              remote_path = posixpath.join(
                  folder,
                  filename
              )

              if not os.path.exists(local_path):
                  print(
                      f"❌ Local file not found: "
                      f"{local_path}"
                  )
                  failed.append(filename)
                  continue

              local_size = os.path.getsize(local_path)

              print("")
              print(
                  f"⬆️ Uploading {filename} "
                  f"({local_size:,} bytes)"
              )

              try:

                  # Open local file
                  with open(local_path, "rb") as local_file:

                      # Open remote file explicitly
                      remote_file = sftp.file(
                          remote_path,
                          "wb"
                      )

                      # Write in chunks
                      while True:

                          chunk = local_file.read(32768)

                          if not chunk:
                              break

                          remote_file.write(chunk)

                      # Force transmission
                      remote_file.flush()

                      # Close remote file
                      remote_file.close()

                  # Verify remote size
                  remote_attr = sftp.stat(remote_path)
                  remote_size = remote_attr.st_size

                  print(
                      f"Remote size: "
                      f"{remote_size:,} bytes"
                  )

                  if remote_size != local_size:

                      print(
                          f"❌ SIZE MISMATCH: "
                          f"{remote_size:,} != "
                          f"{local_size:,}"
                      )

                      failed.append(filename)

                  else:

                      print(
                          f"✅ Upload successful: "
                          f"{filename}"
                      )

              except Exception as e:

                  print(
                      f"❌ Failed to upload "
                      f"{filename}: {repr(e)}"
                  )

                  failed.append(filename)

          sftp.close()
          transport.close()

          print("")
          print("========================================")

          if failed:

              print(
                  f"❌ Failed files: "
                  f"{len(failed)}"
              )

              for filename in failed:
                  print(f"   - {filename}")

              print("========================================")

              sys.exit(1)

          else:

              print("✅ ALL FILES UPLOADED SUCCESSFULLY")
              print("========================================")
          PYEOF
