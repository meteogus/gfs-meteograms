<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>GFS Meteograms</title>

    <style>

        /* ==========================================
           PAGE
           ========================================== */

        body {

            font-family: Arial, sans-serif;

            margin: 0;
            padding: 20px;

            background: #f4f4f4;

            text-align: center;
        }


        h1 {

            margin-bottom: 30px;
        }


        /* ==========================================
           CITY GRID
           ========================================== */

        .grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 25px;

            max-width: 1400px;

            margin: auto;
        }


        /* ==========================================
           CITY CARD
           ========================================== */

        .city {

            background: white;

            padding: 15px;

            border-radius: 10px;

            box-shadow:
                0 2px 8px rgba(0,0,0,0.15);
        }


        .city h2 {

            margin-top: 0;

            margin-bottom: 12px;
        }


        /* ==========================================
           METEOGRAM IMAGE
           ========================================== */

        .city img {

            width: 100%;

            height: auto;

            display: block;

            border-radius: 5px;

            cursor: zoom-in;

            user-select: none;

            -webkit-user-drag: none;
        }


        /* ==========================================
           FULLSCREEN MODAL
           ========================================== */

        .image-modal {

            display: none;

            position: fixed;

            z-index: 9999;

            left: 0;
            top: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(0, 0, 0, 0.92);

            align-items: center;

            justify-content: center;

            padding: 20px;

            box-sizing: border-box;
        }


        /* Modal ενεργό */

        .image-modal.active {

            display: flex;
        }


        /* ==========================================
           LARGE IMAGE
           ========================================== */

        .image-modal img {

            max-width: 96%;

            max-height: 96%;

            width: auto;

            height: auto;

            object-fit: contain;

            border-radius: 5px;

            cursor: default;

            box-shadow:
                0 0 30px rgba(255,255,255,0.15);

            user-select: none;

            -webkit-user-drag: none;
        }


        /* ==========================================
           CLOSE BUTTON
           ========================================== */

        .close-button {

            position: fixed;

            top: 15px;

            right: 25px;

            z-index: 10000;

            color: white;

            font-size: 42px;

            font-weight: bold;

            line-height: 1;

            cursor: pointer;

            user-select: none;
        }


        .close-button:hover {

            color: #cccccc;
        }


        /* ==========================================
           MOBILE
           ========================================== */

        @media (max-width: 600px) {

            body {

                padding: 10px;
            }


            h1 {

                font-size: 26px;

                margin-bottom: 20px;
            }


            .grid {

                grid-template-columns: 1fr;

                gap: 15px;
            }


            .city {

                padding: 10px;
            }


            .city h2 {

                font-size: 20px;
            }


            .image-modal {

                padding: 5px;
            }


            .image-modal img {

                max-width: 99%;

                max-height: 92%;
            }


            .close-button {

                top: 10px;

                right: 15px;

                font-size: 36px;
            }
        }

    </style>

</head>


<body>


    <!-- ==========================================
         PAGE TITLE
         ========================================== -->

    <h1>GFS Meteograms</h1>


    <!-- ==========================================
         CITY GRID
         ========================================== -->

    <div class="grid">


        <!-- ATHENS -->

        <div class="city">

            <h2>Athens</h2>

            <img
                src="images/athens_latest.png"
                alt="Athens GFS Meteogram"
                onclick="openImage(this)"
            >

        </div>


        <!-- KIATO -->

        <div class="city">

            <h2>Kiato</h2>

            <img
                src="images/kiato_latest.png"
                alt="Kiato GFS Meteogram"
                onclick="openImage(this)"
            >

        </div>


        <!-- LAMIA -->

        <div class="city">

            <h2>Lamia</h2>

            <img
                src="images/lamia_latest.png"
                alt="Lamia GFS Meteogram"
                onclick="openImage(this)"
            >

        </div>


        <!-- PATRA -->

        <div class="city">

            <h2>Patra</h2>

            <img
                src="images/patra_latest.png"
                alt="Patra GFS Meteogram"
                onclick="openImage(this)"
            >

        </div>


        <!-- SALONICA -->

        <div class="city">

            <h2>Salonica</h2>

            <img
                src="images/salonica_latest.png"
                alt="Salonica GFS Meteogram"
                onclick="openImage(this)"
            >

        </div>


    </div>


    <!-- ==========================================
         IMAGE MODAL
         ========================================== -->

    <div
        id="imageModal"
        class="image-modal"
        onclick="closeImage(event)"
    >


        <!-- CLOSE BUTTON -->

        <span
            class="close-button"
            onclick="closeModal(event)"
        >
            ×
        </span>


        <!-- LARGE IMAGE -->

        <img
            id="modalImage"
            src=""
            alt="Large GFS Meteogram"
        >


    </div>


    <!-- ==========================================
         JAVASCRIPT
         ========================================== -->

    <script>


        /* ==========================================
           OPEN IMAGE
           ========================================== */

        function openImage(image) {

            const modal =
                document.getElementById("imageModal");

            const modalImage =
                document.getElementById("modalImage");


            modalImage.src = image.src;

            modalImage.alt = image.alt;


            modal.classList.add("active");


            /*
             * Prevent page scrolling while
             * the large image is open.
             */

            document.body.style.overflow = "hidden";
        }



        /* ==========================================
           CLOSE MODAL
           ========================================== */

        function closeModal(event) {

            /*
             * Prevent the click from propagating
             * to the black background.
             */

            if (event) {

                event.stopPropagation();
            }


            const modal =
                document.getElementById("imageModal");


            modal.classList.remove("active");


            document.body.style.overflow = "auto";
        }



        /* ==========================================
           CLOSE BY CLICKING BLACK BACKGROUND
           ========================================== */

        function closeImage(event) {

            /*
             * Close ONLY when the user clicks
             * the black background itself.
             *
             * Clicking the large image does NOT
             * close it.
             */

            if (event.target ===
                document.getElementById("imageModal")) {

                closeModal();
            }
        }



        /* ==========================================
           CLOSE WITH ESC
           ========================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (event.key === "Escape") {

                    closeModal();
                }

            }
        );


    </script>


</body>

</html>
