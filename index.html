<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GFS Meteograms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: auto;
        }

        .city {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .city h2 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .city img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>

<body>

    <h1>GFS Meteograms</h1>

    <div class="grid">

        <div class="city">
            <h2>Athens</h2>
            <img src="athens_latest.png" alt="Athens GFS Meteogram">
        </div>

        <div class="city">
            <h2>Kiato</h2>
            <img src="kiato_latest.png" alt="Kiato GFS Meteogram">
        </div>

        <div class="city">
            <h2>Lamia</h2>
            <img src="lamia_latest.png" alt="Lamia GFS Meteogram">
        </div>

        <div class="city">
            <h2>Patra</h2>
            <img src="patra_latest.png" alt="Patra GFS Meteogram">
        </div>

        <div class="city">
            <h2>Salonica</h2>
            <img src="salonica_latest.png" alt="Salonica GFS Meteogram">
        </div>

    </div>

</body>
</html>
