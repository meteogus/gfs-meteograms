<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GFS Meteograms</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f4;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 25px;
            max-width: 1400px;
            margin: auto;
        }

        .city {
            background: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        .city h2 {
            margin-top: 0;
            margin-bottom: 12px;
        }

        .city img {
            width: 100%;
            height: auto;
            display: block;

            /* Δείχνει ότι η εικόνα είναι clickable */
            cursor: zoom-in;

            border-radius: 5px;
        }

        /* ==========================================
           FULLSCREEN IMAGE OVERLAY
           ========================================== */

        .image-modal {
            display: none;
            position: fixed;
            z-index: 9999;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.90);

            align-items: center;
            justify-content: center;

            padding: 20px;
            box-sizing: border-box;
        }

        .image-modal.active {
            display: flex;
        }

        .image-modal img {
            max-width: 95%;
            max-height: 95%;
            width: auto;
            height: auto;

            object-fit: contain;

            border-radius: 5px;

            cursor: zoom-out;

            box-shadow: 0 0 25px rgba(255,255,255,0.15);
        }

        /* Κουμπί κλεισίματος */

        .close-button {
            position: fixed;
            top: 15px;
            right: 25px;

            color: white;
            font-size: 40px;
            font-weight: bold;

            cursor: pointer;

            z-index: 10000;

            line-height: 1;
        }

        .close-button:hover {
            color: #cccccc;
        }

        /* Καλύτερη εμφάνιση σε κινητό */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .image-modal {
                padding: 5px;
            }

            .image-modal img {
                max-width: 98%;
                max-height: 90%;
            }

            .close-button {
                top: 10px;
                right: 15px;
                font-size: 35px;
            }
        }

    </style>
</head>

<body>

    <h1>GFS Meteograms</h1>

    <div class="grid">

        <div class="city">
            <h2>Athens</h2>
            <img src="athens_latest.png"
                 alt="Athens GFS Meteogram"
                 onclick="openImage(this)">
        </div>

        <div class="city">
            <h2>Kiato</h2>
            <img src="kiato_latest.png"
                 alt="Kiato GFS Meteogram"
                 onclick="openImage(this)">
        </div>

        <div class="city">
            <h2>Lamia</h2>
            <img src="lamia_latest.png"
                 alt="Lamia GFS Meteogram"
                 onclick="openImage(this)">
        </div>

        <div class="city">
            <h2>Patra</h2>
            <img src="patra_latest.png"
                 alt="Patra GFS Meteogram"
                 onclick="openImage(this)">
        </div>

        <div class="city">
            <h2>Salonica</h2>
            <img src="salonica_latest.png"
                 alt="Salonica GFS Meteogram"
                 onclick="openImage(this)">
        </div>

    </div>


    <!-- ==========================================
         IMAGE MODAL
         ========================================== -->

    <div id="imageModal"
         class="image-modal"
         onclick="closeImage(event)">

        <span class="close-button"
              onclick="closeModal()">×</span>

        <img id="modalImage"
             src=""
             alt="Large GFS Meteogram">

    </div>


    <script>

        function openImage(image) {

            const modal = document.getElementById("imageModal");
            const modalImage = document.getElementById("modalImage");

            modalImage.src = image.src;
            modalImage.alt = image.alt;

            modal.classList.add("active");

            // Αποτρέπει το scrolling της σελίδας
            document.body.style.overflow = "hidden";
        }


        function closeModal() {

            const modal = document.getElementById("imageModal");

            modal.classList.remove("active");

            document.body.style.overflow = "auto";
        }


        function closeImage(event) {

            /*
             * Κλείνει μόνο όταν πατηθεί το
             * μαύρο background και όχι η ίδια η εικόνα.
             */

            if (event.target.id === "imageModal") {
                closeModal();
            }
        }


        /*
         * Κλείσιμο με το πλήκτρο ESC
         */

        document.addEventListener("keydown", function(event) {

            if (event.key === "Escape") {
                closeModal();
            }

        });

    </script>

</body>
</html>
